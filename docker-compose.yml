services:
    app:
        build:
            context: ./
            dockerfile: Dockerfile
        volumes:
            - myapp:/var/www
            - ./.env:/var/www/.env
        depends_on:
            - db
    db:
        image: mysql
        restart: always
        environment:
            MYSQL_ROOT_user: root
            MYSQL_ROOT_PASSWORD: root
    web-server:
        image: nginx:stable-alpine3.20-perl
        depends_on:
            - app
        ports:
            - 80:80
        volumes:
            - myapp:/var/www
            - ./default.conf:/etc/nginx/conf.d/default.conf
        restart: always
volumes:
    myapp:
